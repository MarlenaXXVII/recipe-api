spring.application.name=recipe-api

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/recipe_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.security.oauth2.resourceserver.jwt.audiences=account
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/recipe-app

my.upload_location=uploads/recipes
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
